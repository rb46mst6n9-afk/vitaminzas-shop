<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VITA — магазин витаминов</title>
<style>
:root{--red:#d91f3f;--red2:#ef5b70;--rose:#fff0f3;--pink:#ffe4e9;--dark:#2b2527;--muted:#8b8083;--bg:#fffafb;--card:#fff;--line:#f1dfe3;--gold:#d79a32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:720px;margin:auto;padding-bottom:90px}
.top{padding:18px 18px 10px;background:var(--bg)}
.topline{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:950;letter-spacing:-1.3px;color:var(--red)}.logo span{color:var(--red2)}.brand{color:var(--red);text-shadow:0 2px 10px #d91f3f18}
.icon{width:42px;height:42px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 20px #16372a0d}
.hero{margin:10px 16px 18px;padding:23px;border-radius:25px;background:linear-gradient(135deg,#ffe7ec,#fffafb);position:relative;overflow:hidden;border:1px solid #f6d8de}
.hero:after{content:"✚";position:absolute;right:22px;bottom:-18px;font-size:105px;color:#fff8;font-weight:900}
.hero small{color:var(--red);font-weight:800}.hero h1{font-size:27px;line-height:1.1;margin:8px 0}.hero p{margin:0;color:#61706a;font-size:14px;max-width:280px}
.search{margin:0 16px 16px;display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:0 14px}.search input{width:100%;border:0;outline:0;padding:14px 9px;background:transparent}
.cats{display:flex;gap:8px;overflow:auto;padding:0 16px 14px}.cats button{border:0;border-radius:20px;padding:10px 15px;background:#fff;color:#59665f;white-space:nowrap}.cats .active{background:var(--dark);color:#fff}
.section{padding:0 16px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:7px 0 11px}.sectionhead h2{font-size:20px;margin:0}.count{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;position:relative;box-shadow:0 7px 25px #9f40500d}
.pic{height:125px;border-radius:15px;background:linear-gradient(145deg,#fff7f8,#ffe9ee);display:flex;align-items:center;justify-content:center;font-size:53px;margin-bottom:11px}
.badge{position:absolute;top:20px;left:20px;background:#fff;border-radius:9px;padding:5px 7px;font-size:10px;font-weight:800;color:var(--red)}
.like{position:absolute;top:19px;right:19px;width:31px;height:31px;border:0;border-radius:10px;background:#fff;box-shadow:0 4px 12px #0001}.like.on{color:#e34b62}
.pname{font-weight:800;font-size:15px}.desc{font-size:12px;color:var(--muted);margin:4px 0 8px;min-height:30px}.rating{font-size:12px;color:#9a7b2b}.price{display:flex;align-items:baseline;gap:7px;margin:7px 0}.new{font-weight:900}.old{text-decoration:line-through;color:#aab2ae;font-size:12px}
.add{width:100%;border:0;background:var(--red);color:#fff;padding:11px;border-radius:12px;font-weight:800}
.bottom{position:fixed;bottom:12px;left:16px;right:16px;max-width:688px;margin:auto;z-index:20;display:none}.cartbar{border:0;width:100%;padding:15px 17px;background:var(--dark);color:#fff;border-radius:17px;box-shadow:0 12px 35px #8d1c2c35;display:flex;justify-content:space-between;font-weight:800}
.modal{position:fixed;inset:0;background:#2b252766;display:none;align-items:flex-end;z-index:30}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:25px 25px 0 0;padding:20px;max-height:88vh;overflow:auto}.sheettop{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0 0 14px}.close{border:0;width:35px;height:35px;border-radius:50%;background:#eef2ef}
.cartitem{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:10px}.qty button{border:0;width:30px;height:30px;border-radius:9px;background:#edf4f0}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:900;padding:18px 0}
.field{width:100%;padding:13px;border:1px solid #dfe6e2;border-radius:12px;margin:5px 0 9px;outline:0}.checkout{width:100%;border:0;background:var(--red);color:#fff;border-radius:13px;padding:14px;font-weight:900}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
@media(max-width:390px){.grid{gap:8px}.pic{height:105px}.pname{font-size:14px}}

.floral{position:absolute;pointer-events:none;opacity:.72;color:#ef9aaa;font-size:34px;line-height:1;filter:drop-shadow(0 3px 7px #d91f3f12)}
.f1{right:8px;top:2px}.f2{left:8px;bottom:2px;transform:rotate(-18deg)}.f3{right:12px;bottom:0;transform:rotate(15deg)}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="topline"><div><div class="logo brand">VITAMINZAS<span>®</span></div><div style="font-size:10px;color:#9b8589;margin-top:-2px">витамины • здоровье • красота</div></div><button class="icon" onclick="openCart()">🛒</button></div></header>

<section class="hero"><div class="floral f1">✿</div><div class="floral f2">❀</div><small>VITAMINZAS • ЗАБОТА О СЕБЕ</small><h1>Красота.<br>Энергия.<br>Здоровье.</h1><p>Качественные витамины и добавки для тебя и твоих близких.</p></section>

<div class="search">🔎<input id="search" placeholder="Найти витамин или добавку..." oninput="render()"></div>
<div class="cats" id="cats"></div>

<section class="section"><div class="sectionhead"><h2>Каталог</h2><span class="count" id="countProducts"></span></div><div class="grid" id="products"></div></section>
</div>

<div class="bottom" id="bottom"><button class="cartbar" onclick="openCart()"><span>🛒 Корзина · <b id="cartCount">0</b></span><span id="cartTotal">0 сум</span></button></div>

<div class="modal" id="modal" onclick="if(event.target===this)closeCart()">
<div class="sheet">
<div class="sheettop"><h2>Ваша корзина</h2><button class="close" onclick="closeCart()">×</button></div>
<div id="cartItems"></div>
<div class="total"><span>Итого</span><span id="sum">0 сум</span></div>
<h3>Оформление заказа</h3>
<input class="field" id="name" placeholder="Ваше имя">
<input class="field" id="phone" placeholder="Номер телефона">
<input class="field" id="address" placeholder="Адрес доставки">
<button class="checkout" onclick="order()">Оформить заказ</button>
</div></div>

<script>
const products=[
{id:1,cat:"Витамины",name:"Vitamin D3",desc:"Поддержка иммунитета и костей",price:50000,old:65000,emoji:"☀️",rating:"★ 4.9",badge:"ХИТ"},
{id:2,cat:"Минералы",name:"Magnesium",desc:"Для нервной системы и мышц",price:70000,old:85000,emoji:"⚡",rating:"★ 4.8",badge:"-18%"},
{id:3,cat:"Омега",name:"Omega-3",desc:"Поддержка сердца и мозга",price:90000,old:110000,emoji:"🐟",rating:"★ 4.9",badge:"ХИТ"},
{id:4,cat:"Минералы",name:"Zinc",desc:"Минерал для иммунитета",price:60000,old:70000,emoji:"🛡️",rating:"★ 4.7",badge:""},
{id:5,cat:"Витамины",name:"Vitamin C",desc:"Антиоксидант и поддержка иммунитета",price:55000,old:65000,emoji:"🍊",rating:"★ 4.9",badge:"NEW"},
{id:6,cat:"Витамины",name:"B-Complex",desc:"Энергия и поддержка нервной системы",price:75000,old:90000,emoji:"💚",rating:"★ 4.8",badge:""}
];
let category="Все",cart={},favorites=new Set();
const money=n=>n.toLocaleString("ru-RU");
function renderCats(){let cats=["Все",...new Set(products.map(p=>p.cat))];document.getElementById("cats").innerHTML=cats.map(c=>`<button class="${c===category?"active":""}" onclick="category='${c}';renderCats();render()">${c}</button>`).join("")}
function render(){
 let q=document.getElementById("search").value.toLowerCase();
 let list=products.filter(p=>(category==="Все"||p.cat===category)&&(!q||(p.name+" "+p.desc).toLowerCase().includes(q)));
 document.getElementById("countProducts").textContent=list.length+" товаров";
 document.getElementById("products").innerHTML=list.length?list.map(p=>`
 <article class="product"><div class="pic">${p.emoji}</div>${p.badge?`<span class="badge">${p.badge}</span>`:""}
 <button class="like ${favorites.has(p.id)?"on":""}" onclick="fav(${p.id})">${favorites.has(p.id)?"♥":"♡"}</button>
 <div class="pname">${p.name}</div><div class="desc">${p.desc}</div><div class="rating">${p.rating}</div>
 <div class="price"><span class="new">${money(p.price)} сум</span><span class="old">${money(p.old)}</span></div>
 <button class="add" onclick="add(${p.id})">Добавить в корзину</button></article>`).join(""):`<div class="empty">Ничего не найдено</div>`;
 updateCart();
}
function fav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);render()}
function add(id){cart[id]=(cart[id]||0)+1;updateCart()}
function change(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];openCart()}
function updateCart(){
 let count=Object.values(cart).reduce((a,b)=>a+b,0),total=products.reduce((s,p)=>s+p.price*(cart[p.id]||0),0);
 document.getElementById("cartCount").textContent=count;document.getElementById("cartTotal").textContent=money(total)+" сум";
 document.getElementById("bottom").style.display=count?"block":"none";
}
function openCart(){
 let items=products.filter(p=>cart[p.id]).map(p=>`<div class="cartitem"><div><b>${p.name}</b><br><small>${money(p.price)} сум</small></div><div class="qty"><button onclick="change(${p.id},-1)">−</button><b>${cart[p.id]}</b><button onclick="change(${p.id},1)">+</button></div></div>`).join("");
 document.getElementById("cartItems").innerHTML=items||'<div class="empty">Корзина пока пуста</div>';
 let total=products.reduce((s,p)=>s+p.price*(cart[p.id]||0),0);document.getElementById("sum").textContent=money(total)+" сум";
 document.getElementById("modal").style.display="flex";
}
function closeCart(){document.getElementById("modal").style.display="none"}
function order(){
 let name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim();
 if(!Object.keys(cart).length){alert("Корзина пуста");return}
 if(!name||!phone||!address){alert("Заполните имя, телефон и адрес");return}
 alert("Заказ готов! После подключения к Telegram он будет отправляться прямо владельцу магазина.");
}
renderCats();render();
</script>
</body>
</html>
